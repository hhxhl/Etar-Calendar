name: Build Etar Hhxhl

# Manual signed release build; upload APKs to Actions Artifacts only.
on:
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to build'
        required: true
        default: 'master-hhxhl'
        type: string
      upload_name:
        description: 'Artifact name'
        required: false
        default: 'etar-hhxhl'
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master-hhxhl'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Restore release keystore
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEY_BASE64:?Missing KEY_BASE64 secret}"
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/etar-release.key"
          test -s "$RUNNER_TEMP/etar-release.key"

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_signingStoreLocation: ${{ runner.temp }}/etar-release.key
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ORG_GRADLE_PROJECT_signingStorePassword:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${ORG_GRADLE_PROJECT_signingKeyAlias:?Missing SIGNING_KEY_ALIAS secret}"
          : "${ORG_GRADLE_PROJECT_signingKeyPassword:?Missing SIGNING_KEY_PASSWORD secret}"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} > 0 ))
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload_name || 'etar-hhxhl' }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/etar-release.key"

  cleanup:
    needs: build
    if: ${{ always() && github.ref == 'refs/heads/master-hhxhl' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Keep latest 5 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_ID=$(gh api \
            "repos/$REPO/actions/runs/$CURRENT_RUN" \
            --jq '.workflow_id')

          gh api --paginate --slurp \
            "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100" |
          jq -r '
            [.[].workflow_runs[]]
            | sort_by(.run_number)
            | reverse
            | .[5:][]
            | select(.status == "completed")
            | .id
          ' |
          while read -r RUN_ID; do
            if [[ "$RUN_ID" != "$CURRENT_RUN" ]]; then
              echo "Deleting workflow run $RUN_ID"
              gh api --method DELETE \
                "repos/$REPO/actions/runs/$RUN_ID"
            fi
          done
